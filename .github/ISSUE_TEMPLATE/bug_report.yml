name: Bug report
description: Report a reproducible problem using synthetic data and sanitized evidence.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Knowledge Base Command Center.

        Use a scratch vault when practical. Do not attach private notes, data.json, recovery/conflict-rescue JSON, vault names, patient information, credentials, local absolute paths, or copyrighted source content. Replace titles and paths with synthetic examples.

        Do not disclose a vulnerability here. Follow the repository Security policy instead.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Copy the installed version from Settings → Community plugins.
      placeholder: 0.10.0
    validations:
      required: true
  - type: input
    id: obsidian-platform
    attributes:
      label: Obsidian version and platform
      placeholder: Obsidian 1.13.x · macOS / Windows / Linux / iPhone / iPad / Android
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Community Plugins
        - BRAT
        - Manual release files
        - Local development build
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Active knowledge-base preset
      options:
        - Generic knowledge base
        - ENT clinical preset
        - Unsure
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Knowledge Index or visual arrangement
        - Custom Library or Library management
        - Built-in ENT Library
        - Collections, pins, queues, or saved views
        - Search or record details
        - Note creation or templates
        - Export, import, or recovery
        - Knowledge-base lifecycle or switching
        - Settings, startup, or Sync
        - Other
    validations:
      required: true
  - type: dropdown
    id: device-scope
    attributes:
      label: Device and knowledge-base scope
      description: Choose the closest description.
      options:
        - One device and one knowledge base
        - One device and several knowledge bases
        - Several synced devices
        - Unsure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic note names and paths. State whether the issue reproduces in a scratch vault.
      placeholder: |
        1. Create a Generic base named Example
        2. Add Scratch/Example.md to a Library
        3. Open …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: sanitized-console
    attributes:
      label: Sanitized console output
      description: Remove note content, private paths, IDs, credentials, patient information, and copyrighted source text. Do not paste plugin data or recovery files.
      render: shell
    validations:
      required: false
  - type: textarea
    id: sanitized-screenshots
    attributes:
      label: Sanitized screenshots
      description: Use synthetic records. Remove vault names, paths, note bodies, credentials, patient information, and copyrighted source text.
    validations:
      required: false
  - type: input
    id: regression
    attributes:
      label: Last version known to work
      description: Leave blank if unknown or if this never worked.
      placeholder: 0.8.3
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safety confirmation
      options:
        - label: I removed private note content, data.json, recovery/conflict files, credentials, patient information, local absolute paths, and copyrighted source text.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
        - label: I reproduced this in a scratch vault when practical.
          required: false
